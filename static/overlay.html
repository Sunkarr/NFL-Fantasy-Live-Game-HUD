<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFL Fantasy Live Game HUD</title>
  <link rel="stylesheet" href="/static/overlay.css" />
</head>
<body>
  <!-- Ultra-Slim 68px Top Bar -->
  <header id="hud-top-bar">
    <!-- Left: Week Badge (Audio toggled via Welcome Setup Dialog / Hotkey M) -->
    <div class="hud-brand">
      <span id="hud-week-tag" class="week-tag">WK 1</span>
    </div>

    <!-- Center / Left: 3 League Matchup Kacheln (~75% Width) -->
    <main id="matchups-container" class="matchups-container">
      <!-- Dynamically rendered by overlay.js -->
    </main>

    <!-- Right: Inline Highlight Queue Segment (~25% Width) -->
    <aside id="highlight-container" class="highlight-queue-container">
      <!-- Dynamically rendered by overlay.js -->
    </aside>
  </header>

  <!-- HUD Toast Notification Overlay -->
  <div id="hud-toast" class="hud-toast" aria-live="polite"></div>

  <script src="/static/overlay.js"></script>
</body>
</html>
