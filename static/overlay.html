<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFL Fantasy Live Game HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/overlay.css?v=2.2.2" />
</head>
<body>
  <!-- Ultra-Slim 68px Top Bar -->
  <header id="hud-top-bar">
    <!-- Left: Week Badge (Audio toggled via Welcome Setup Dialog / Hotkey M) -->
    <div class="hud-brand">
      <span id="hud-week-tag" class="week-tag">WK 1</span>
    </div>

    <!-- Center / Left: League Matchup Kacheln (~75% Width) -->
    <main id="hud-matchups-container" class="matchups-container">
      <!-- Dynamically rendered by overlay.js -->
    </main>

    <!-- Right: Inline Highlight Queue Segment (~25% Width) -->
    <aside id="hud-highlight-container" class="highlight-queue-container">
      <!-- Dynamically rendered by overlay.js -->
    </aside>
  </header>

  <!-- HUD Toast Notification Overlay -->
  <div id="hud-toast" class="hud-toast" aria-live="polite"></div>

  <script src="/static/overlay.js?v=2.2.2"></script>
</body>
</html>
